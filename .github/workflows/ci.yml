name: ci

on:
  push:
  pull_request:

jobs:
  doc-quality:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run doc quality checks
        run: python scripts/check_docs.py
      - name: Install test deps
        run: pip install pytest
      - name: Run pytest
        run: pytest -q
