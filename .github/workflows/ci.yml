name: ci

on:
  push:
  pull_request:

jobs:
  doc-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check markdown links
        run: python scripts/check_doc_links.py
      - name: Check code fence languages
        run: python scripts/check_code_fences.py
      - name: Check single H1 per doc
        run: python scripts/check_single_h1.py
